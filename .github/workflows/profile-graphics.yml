name: Generate profile graphics

permissions:
  contents: write

concurrency:
  group: profile-graphics-${{ github.repository }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - ".github/workflows/profile-graphics.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build portfolio graphics & README
        run: node scripts/build.mjs dist ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#E04818&color_dots=#F1F5F9,#FED7AA,#FB923C,#EA580C,#9A3412
            dist/snake-dark.svg?color_snake=#FF5722&color_dots=#0F1219,#431407,#7C2D12,#C2410C,#FF5722

      - name: Sync README changes if updated
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto-sync README with latest data" README.md
            git push
          fi

      - name: Deploy graphics to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
