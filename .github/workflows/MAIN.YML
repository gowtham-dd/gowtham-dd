
# GitHub Actions — Profile Auto-Update
# Generates:
#   ① Snake contribution animation (light + dark SVGs)
#   ② Medium blog posts auto-fetched into README

name: 🔄 Profile Auto-Update

on:
  schedule:
    - cron: "0 */6 * * *"      # Snake: every 6 hours
    - cron: "0 8 * * *"        # Blog posts: daily at 8am UTC
  workflow_dispatch:             # Manual trigger from Actions tab

jobs:

  # ─── JOB 1: Snake Animation ───────────────────────────────────
  snake:
    name: 🐍 Generate Snake Animation
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── JOB 2: Blog Post Feed (Medium) ──────────────────────────
  blog-posts:
    name: 📝 Sync Medium Blog Posts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Latest Medium Articles
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@gowthamd997"
          max_post_count: 4
          readme_path: README.md
          comment_tag_name: BLOG-POST-LIST
          template: "[$title]($url) — $date"
          date_format: "ddd DD MMM"
